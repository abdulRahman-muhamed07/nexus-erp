<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus ERP — Business Suite (Complete Build)</title>
<link rel="icon" href="https://image.qwenlm.ai/public_source/d43ae1c8-b806-4c44-b2c8-5cc2644be726/134aee309-c301-4af0-8d1b-70575ac3c49e.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.1.1/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f2f4f9; --panel:#ffffff; --panel2:#f8fafc; --text:#1a2332; --muted:#64748b;
  --border:#e6e9f0; --primary:#4f46e5; --primary2:#7c3aed; --green:#10b981; --amber:#f59e0b;
  --red:#ef4444; --blue:#3b82f6; --chart-grid:rgba(100,116,139,.14); --sbw:264px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
[data-theme="dark"]{
  --bg:#0b1020; --panel:#141b30; --panel2:#1a2340; --text:#e6eaf3; --muted:#8a93ad;
  --border:#242e4d; --chart-grid:rgba(138,147,173,.15);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth}
body{font-family:'Inter Variable','Inter',system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background .25s,color .25s}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;transition:border .15s,box-shadow .15s;width:100%}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
label input,label select{margin-top:5px;font-weight:500}
.muted{color:var(--muted)}.small{font-size:12px}.strong{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.spacer{flex:1}.ta-r{text-align:right}
.hidden{display:none!important}

/* ===== Layout ===== */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50;transition:width .25s,transform .25s}
.main{margin-left:var(--sbw);min-height:100vh;transition:margin .25s;min-width:0}
.view{padding:24px;max-width:1460px;margin:0 auto;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.brand-text b{font-size:16px;letter-spacing:-.3px}.brand-text b span{color:var(--primary)}
.brand-text small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav-sec{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;text-decoration:none;margin-bottom:2px;transition:.15s;cursor:pointer;border:1px solid transparent}
.nav-item i{width:20px;text-align:center;font-size:15px}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(79,70,229,.14),rgba(124,58,237,.10));color:var(--primary);border-color:rgba(79,70,229,.25)}
[data-theme="dark"] .nav-item.active{color:#a5b4fc}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.sys-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:600}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
body.collapsed .sidebar{width:78px}
body.collapsed .brand-text,body.collapsed .nav-label,body.collapsed .nav-sec,body.collapsed .sidebar-foot{display:none}
body.collapsed .nav-item{justify-content:center;padding:11px}
body.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
#sbOverlay{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:45;opacity:0;pointer-events:none;transition:.25s}

/* ===== Topbar ===== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 24px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-title h1{font-size:16px;letter-spacing:-.2px}.tb-title p{font-size:11.5px;color:var(--muted)}
.tb-search{position:relative;flex:1;max-width:430px;display:flex;align-items:center}
.tb-search>i{position:absolute;left:13px;color:var(--muted);font-size:13px}
.tb-search input{padding-left:36px;padding-right:40px;background:var(--panel2)}
.tb-search kbd{position:absolute;right:10px;border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--muted);background:var(--panel)}
.search-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:none;max-height:380px;overflow:auto;z-index:70}
.search-pop.show{display:block;animation:fadeUp .18s ease}
.sp-group{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.sp-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;background:none;border:none;text-align:left;font-size:13px;color:var(--text)}
.sp-item i{color:var(--primary);width:16px}
.sp-item em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.sp-item:hover{background:var(--panel2)}
.sp-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:.15s;position:relative;flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.icon-btn.sm{width:30px;height:30px;font-size:12px;border-radius:8px}
.icon-btn.danger:hover{color:var(--red);border-color:var(--red);background:rgba(239,68,68,.08)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tb-user{position:relative}
.tb-user>button{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--border);border-radius:12px;padding:5px 10px;color:var(--text)}
.tb-user-meta{text-align:left}.tb-user-meta b{font-size:13px;display:block;line-height:1.2}.tb-user-meta small{color:var(--muted);font-size:11px}
.tb-user .fa-chevron-down{font-size:10px;color:var(--muted)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;flex:none;letter-spacing:.3px}
#tbAvatar{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:12px}
.pop{position:absolute;top:calc(100% + 10px);right:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);display:none;z-index:70;overflow:hidden}
.pop.show{display:block;animation:fadeUp .18s ease}
.notif-pop{width:340px}
.pop-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px}
.pop-head button{background:none;border:none;color:var(--primary);font-size:12px;font-weight:600}
.notif-list{max-height:340px;overflow:auto}
.notif-item{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--panel2)}
.notif-item.unread{background:rgba(79,70,229,.05)}
.n-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.notif-item b{font-size:12.5px;display:block}.notif-item p{font-size:12px;color:var(--muted)}.notif-item time{font-size:11px;color:var(--muted)}
.user-pop{width:230px}
.user-pop .up-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.user-pop .up-head b{font-size:13.5px}.user-pop .up-head p{font-size:12px;color:var(--muted)}
.user-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:none;border:none;color:var(--text);font-size:13px;font-weight:500}
.user-pop button:hover{background:var(--panel2)}
.user-pop button.red{color:var(--red)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:var(--panel);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--muted)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-xs{padding:4px 10px;font-size:11.5px;border-radius:8px}
.btn-lg{padding:12px 20px;font-size:14px}

/* ===== Cards / grids ===== */
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px}.card-h p{font-size:12px;color:var(--muted)}
.card-b{padding:20px}
.grid{display:grid;gap:18px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-21{grid-template-columns:2fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.stack{display:grid;gap:18px}
.mb{margin-bottom:18px}

/* KPI */
.kpi{padding:18px 20px}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.kpi-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.c1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.c2{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}.c3{background:linear-gradient(135deg,#f59e0b,#f97316)}.c4{background:linear-gradient(135deg,#10b981,#14b8a6)}
.spark{width:88px;height:30px;opacity:.9}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-.6px}
.kpi-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.kpi-sub{margin-top:8px;display:flex;align-items:center;gap:7px;font-size:11.5px}
.kpi-delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:2px 8px;border-radius:99px}
.kpi-delta.up{color:#059669;background:rgba(16,185,129,.12)}
.kpi-delta.down{color:#dc2626;background:rgba(239,68,68,.12)}
[data-theme="dark"] .kpi-delta.up{color:#34d399}[data-theme="dark"] .kpi-delta.down{color:#f87171}
.vs{color:var(--muted)}

/* Alert strip */
.alert-strip{display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:14px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.10);margin-bottom:18px;font-size:13px;font-weight:600;flex-wrap:wrap}
.alert-strip i{color:var(--amber);font-size:17px}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);text-align:left;padding:11px 18px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:default;user-select:none}
.tbl th[data-osort]{cursor:pointer}.tbl th[data-osort]:hover{color:var(--text)}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl.mini td,.tbl.mini th{padding:8px 12px}
.row-actions{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty i{font-size:30px;opacity:.5;display:block;margin-bottom:10px}

/* Badges / chips */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:rgba(16,185,129,.13);color:#059669}.b-amber{background:rgba(245,158,11,.14);color:#b45309}
.b-blue{background:rgba(59,130,246,.13);color:#2563eb}.b-violet{background:rgba(139,92,246,.14);color:#7c3aed}
.b-red{background:rgba(239,68,68,.13);color:#dc2626}.b-gray{background:rgba(100,116,139,.14);color:#475569}
.b-gold{background:rgba(234,179,8,.16);color:#a16207}.b-pink{background:rgba(236,72,153,.13);color:#db2777}
[data-theme="dark"] .b-green{color:#34d399}[data-theme="dark"] .b-amber{color:#fbbf24}[data-theme="dark"] .b-blue{color:#60a5fa}
[data-theme="dark"] .b-violet{color:#a78bfa}[data-theme="dark"] .b-red{color:#f87171}[data-theme="dark"] .b-gray{color:#94a3b8}
[data-theme="dark"] .b-gold{color:#facc15}[data-theme="dark"] .b-pink{color:#f472b6}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-weight:600;font-size:12.5px;display:inline-flex;gap:7px;align-items:center;transition:.15s}
.chip span{background:var(--panel2);border-radius:99px;padding:1px 7px;font-size:10.5px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.on span{background:rgba(255,255,255,.22);color:#fff}
.chip:hover:not(.on){border-color:var(--muted)}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar.inner{margin:0;padding:14px 18px;border-bottom:1px solid var(--border);justify-content:flex-start}
.search-box{position:relative;display:flex;align-items:center}
.search-box i{position:absolute;left:12px;color:var(--muted);font-size:12px}
.search-box input{padding-left:34px;width:280px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;flex-wrap:wrap}
.pager-btns{display:flex;gap:6px;align-items:center}
.page-n{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-size:12px;font-weight:600;color:var(--muted)}
.page-n.on{background:var(--primary);border-color:var(--primary);color:#fff}
.dots{color:var(--muted)}

/* Misc */
.stepper{display:inline-flex;align-items:center;gap:8px}
.stock-n{min-width:34px;text-align:center;font-weight:700;font-size:13px}
.stars i{color:var(--amber);font-size:11px}.stars em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:4px}
.bar{height:6px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
.chart-box{height:300px;position:relative}
.tp-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.tp-row:last-child{border-bottom:none}
.tp-rank{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--muted)}
.act-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-ico{width:32px;height:32px;border-radius:9px;background:rgba(99,102,241,.12);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.act-item p{font-size:12.5px}.act-item time{font-size:11px;color:var(--muted)}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--border);transition:.2s;cursor:pointer}
.switch i:before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + i{background:var(--primary)}
.switch input:checked + i:before{transform:translateX(18px)}
.pref-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.pref-row:last-child{border-bottom:none}
.pref-row b{font-size:13px;display:block}.pref-row p{font-size:12px;color:var(--muted)}
.theme-opt{border:2px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:.15s}
.theme-opt.on{border-color:var(--primary);background:rgba(79,70,229,.06)}
.theme-swatch{width:44px;height:30px;border-radius:8px;border:1px solid var(--border)}

/* Modal */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.show{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(8,12,24,.55);backdrop-filter:blur(3px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{position:relative;margin:5vh auto;width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.3);max-height:90vh;display:flex;flex-direction:column;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px}.modal-head p{font-size:12px;color:var(--muted)}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;align-items:center;padding:16px 22px;border-top:1px solid var(--border)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.items-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:6px 0 8px}
.draft-row{display:grid;grid-template-columns:1fr 74px 90px 34px;gap:8px;align-items:center;margin-bottom:8px}
.draft-line{font-weight:700;font-size:12.5px;text-align:right}
.of-totals{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px;font-size:13px}
.of-totals>div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.of-totals>div span{color:var(--text);font-weight:600}
.of-totals .tt{font-size:15px;font-weight:800;color:var(--text)}
.of-totals .tt span{font-weight:800;color:var(--primary)}
.ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.ov-grid span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px}
.confirm-ico{width:42px;height:42px;border-radius:12px;background:rgba(239,68,68,.12);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:17px}

<script>
'use strict';
/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const money=n=>'$'+Math.round(Number(n||0)).toLocaleString('en-US');
const money2=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtDT=d=>fmtDate(d)+' · '+new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const daysAgoISO=d=>new Date(Date.now()-d*864e5).toISOString();

const STYLE={'Pending':'b-amber','Processing':'b-blue','Shipped':'b-violet','Delivered':'b-green','Cancelled':'b-red','Paid':'b-green','Overdue':'b-red','Active':'b-green','On Leave':'b-amber','Approved':'b-blue','In Transit':'b-violet','Received':'b-green','Out of Stock':'b-red','Low Stock':'b-amber','In Stock':'b-green','VIP':'b-gold','Standard':'b-gray','New':'b-blue','Sales':'b-violet','Engineering':'b-blue','Finance':'b-green','Human Resources':'b-gold','Support':'b-pink','Marketing':'b-pink','Operations':'b-gray'};

const FLAGS={'United States':'🇺🇸','United Kingdom':'🇬🇧','Mexico':'🇲🇽','Singapore':'🇸🇬','Germany':'🇩🇪','Canada':'🇨🇦','Australia':'🇦🇺','South Korea':'🇰🇷','United Arab Emirates':'🇦🇪','Sweden':'🇸🇪','China':'🇨🇳'};
function pct(cur,prev){return prev>0?((cur-prev)/prev*100):null;}
function deltaHtml(p){if(p===null)return'<span class="vs">— vs last month</span>';const up=p>=0;return `<span class="kpi-delta ${up?'up':'down'}"><i class="fa-solid fa-arrow-trend-${up?'up':'down'}"></i>${Math.abs(p).toFixed(1)}%</span><span class="vs">vs last month</span>`;}
function spark(vals,color){if(!vals||vals.length<2)return'';const w=96,h=30,min=Math.min(...vals),max=Math.max(...vals),rg=max-min||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${(h-((v-min)/rg)*(h-6)-3).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function stars(r){let s='';for(let i=1;i<=5;i++)s+=`<i class="fa-${i<=Math.round(r)?'solid':'regular'} fa-star"></i>`;return `<span class="stars">${s}<em>${Number(r).toFixed(1)}</em></span>`;}
function download(name,mime,content){const b=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}

/* ================= SEED ================= */

  const pre={Electronics:'EL',Accessories:'AC',Furniture:'FU',Office:'OF'};
  const products=P.map((d,i)=>({id:'PRD-'+(1001+i),sku:pre[d[1]]+'-'+(1001+i),name:d[0],category:d[1],price:d[2],cost:d[3],stock:d[4],reorder:d[5],supplier:d[6]}));
  const C=[['Acme Corporation','Sarah Mitchell','United States','VIP',430],['Globex Industries','James Carter','United Kingdom','VIP',380],['Initech Solutions','Maria Gonzalez','Mexico','Standard',300],['Umbrella Retail Group','Chen Wei','Singapore','Standard',260],['Stark Trading GmbH','Emma Wilson','Germany','VIP',230],['Wayne Enterprises','Liam Brown','Canada','Standard',190],['Cyberdyne Systems','Olivia Davis','Australia','New',90],['Hooli Labs','Noah Martinez','United States','Standard',150],['Vandelay Imports','Sophia Lee','South Korea','New',45],['Pinnacle Group','Ethan Taylor','United Arab Emirates','New',12]];
  const customers=C.map((d,i)=>({id:'CUS-'+(501+i),company:d[0],name:d[1],email:d[1].toLowerCase().replace(/[^a-z]+/g,'.')+'@'+d[0].toLowerCase().replace(/[^a-z]+/g,'')+'.com',phone:'+1 ('+ri(200,989)+') '+ri(200,989)+'-'+ri(1000,9999),country:d[2],tier:d[3],since:daysAgoISO(d[4])}));
  const E=[['Daniel Reyes','Sales Director','Sales',92000,'Active',700],['Priya Sharma','Lead Engineer','Engineering',118000,'Active',540],['Tom Becker','Senior Accountant','Finance',68000,'Active',820],['Lucia Fernandez','HR Manager','Human Resources',74000,'On Leave',610],["Kevin O'Neill",'Support Lead','Support',56000,'Active',450],['Aisha Bello','Marketing Specialist','Marketing',61000,'Active',300],['Marcus Chen','DevOps Engineer','Engineering',105000,'Active',260],['Elena Petrova','Sales Executive','Sales',52000,'Active',180],['Ryan Foster','Warehouse Supervisor','Operations',48000,'Active',390],['Maya Kaplan','Product Manager','Engineering',99000,'Active',150]];
  const employees=E.map((d,i)=>({id:'EMP-'+(201+i),name:d[0],role:d[1],dept:d[2],email:d[0].toLowerCase().replace(/[^a-z]+/g,'.')+'@nexuserp.io',salary:d[3],status:d[4],hired:daysAgoISO(d[5])}));
  const S=[['TechSource Ltd','David Kim','South Korea',4.6],['Shenzhen Nova','Lin Zhang','China',4.2],['EuroSupply GmbH','Anna Weber','Germany',4.8],['Pacific Trade Co','Ryan Tan','Singapore',4.0],['Nordic Parts AB','Freja Larsen','Sweden',4.4],['Atlas Components','Omar Haddad','United Arab Emirates',3.9]];
  const suppliers=S.map((d,i)=>({id:'SUP-'+(301+i),name:d[0],contact:d[1],country:d[2],rating:d[3],email:'sales@'+d[0].toLowerCase().replace(/[^a-z]+/g,'')+'.com',phone:'+82 10-'+ri(1000,9999)+'-'+ri(1000,9999)}));
  const orders=[];
  for(let i=0;i<64;i++){
    const age=ri(0,355);
    const created=new Date(Date.now()-age*864e5-ri(0,20)*36e5);

    const sub=items.reduce((s,it)=>s+it.qty*it.price,0);const tax=sub*.08;const ship=sub>1000?0:25;
    let status;
    if(age>30)status=Math.random()<.82?'Delivered':(Math.random()<.4?'Cancelled':'Shipped');
    else if(age>12)status=pick(['Delivered','Shipped','Shipped','Processing']);
    else if(age>4)status=pick(['Shipped','Processing','Pending']);
    else status=pick(['Pending','Processing','Pending']);
    orders.push({customerId:c.id,customerName:c.company,items,sub,tax,ship,total:sub+tax+ship,status,date:created.toISOString()});
  }
  orders.sort((a,b)=>new Date(a.date)-new Date(b.date));

  const invoices=[];
  const src=orders.filter(o=>o.status!=='Cancelled').slice(0,10);
  src.forEach((o,i)=>{const issued=new Date(o.date);const due=new Date(issued.getTime()+30*864e5);const paid=Math.random()<.62;
    invoices.push({id:'INV-'+(2401+i),customerId:o.customerId,customerName:o.customerName,amount:Math.round(o.total),issued:issued.toISOString(),due:due.toISOString(),status:paid?'Paid':(due<new Date()?'Overdue':'Pending'),paidOn:paid?new Date(issued.getTime()+ri(3,25)*864e5).toISOString():null});});
  const PD=[[0,2,40,'Approved',8],[1,7,60,'In Transit',4],[2,9,15,'Pending',18],[3,4,120,'Received',-6],[4,11,200,'Pending',25],[5,13,80,'Approved',12]];

  if(od)notifications.push({id:'ntf4',icon:'fa-clock',title:od+' invoice(s) overdue',desc:'Review outstanding receivables in Finance',time:hoursAgoISO(7),read:true});
  notifications.push({id:'ntf5',icon:'fa-file-invoice-dollar',title:'Payment received',desc:'INV-2401 settled by '+invoices[0].customerName,time:hoursAgoISO(2),read:true});
  const activities=[{icon:'fa-file-invoice-dollar',text:'Invoice INV-2401 paid by '+invoices[0].customerName,time:hoursAgoISO(2)},{icon:'fa-cart-shopping',text:`New order ${orders[0].id} from ${orders[0].customerName}`,time:hoursAgoISO(4)},{icon:'fa-truck',text:'PO-9002 shipped by Shenzhen Nova',time:hoursAgoISO(9)},{icon:'fa-user-plus',text:'New customer Pinnacle Group added',time:hoursAgoISO(26)},{icon:'fa-box',text:'Stock received: 120 × Glide Wireless Mouse',time:hoursAgoISO(31)},{icon:'fa-user-tie',text:'Elena Petrova completed onboarding',time:hoursAgoISO(50)},{icon:'fa-chart-line',text:'Quarterly sales report generated',time:hoursAgoISO(74)},{icon:'fa-tags',text:'Price updated on Vertex 4K Monitor 27"',time:hoursAgoISO(96)}].map((a,i)=>({id:'act'+i,...a}));
  return {version:1,profile:{name:'Alex Morgan',email:'alex.morgan@nexuserp.io',role:'Administrator'},prefs:{emailNotif:true,digest:false,lowStock:true},ui:{collapsed:false},theme:'light',seq:{order:1065,product:1015,cust:511,emp:211,sup:307,po:9007,inv:2411},products,customers,employees,suppliers,orders,invoices,pos,notifications,activities};
}
let db;
function save(){localStorage.setItem(LS_KEY,JSON.stringify(db));}
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.orders)&&d.version===1){db=d;return;}}}catch(e){}db=seed();save();}

/* ================= AGGREGATIONS ================= */
function monthAgg(){const rev=Array(12).fill(0),ord=Array(12).fill(0),units=Array(12).fill(0);const now=new Date();
  db.orders.forEach(o=>{if(o.status==='Cancelled')return;const d=new Date(o.date);const diff=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());if(diff<0||diff>11)return;rev[11-diff]+=o.total;ord[11-diff]++;o.items.forEach(i=>units[11-diff]+=i.qty);});
  return {rev,ord,units};}
function last12Labels(){const a=[];for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);a.push(d.toLocaleDateString('en-US',{month:'short'}));}return a;}
function newCustMonths(){const a=Array(12).fill(0);const now=new Date();db.customers.forEach(c=>{const d=new Date(c.since);const diff=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());if(diff>=0&&diff<12)a[11-diff]++;});return a;}
function catSales(){const m={};db.orders.filter(o=>o.status!=='Cancelled').forEach(o=>o.items.forEach(it=>{const p=db.products.find(x=>x.id===it.productId);const c=p?p.category:'Other';m[c]=(m[c]||0)+it.qty*it.price;}));return m;}
function topProducts(){const m={};db.orders.filter(o=>o.status!=='Cancelled').forEach(o=>o.items.forEach(it=>{m[it.name]=m[it.name]||{units:0,rev:0};m[it.name].units+=it.qty;m[it.name].rev+=it.qty*it.price;}));return Object.entries(m).sort((a,b)=>b[1].rev-a[1].rev);}
function expSeries(rev){return rev.map((v,i)=>Math.round(v*.58+420+(i%3)*260));}
const PALETTE=['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#06b6d4','#f43f5e'];

/* ================= SHARED UI ================= */
function toast(msg,icon='fa-circle-check',type='success'){const el=document.createElement('div');el.className='toast '+type;el.innerHTML=`<i class="fa-solid ${icon}"></i><span>${esc(msg)}</span>`;$('#toasts').appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},3200);}
function openModal(html,width=560){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop"></div><div class="modal" style="max-width:${width}px">${html}</div>`;root.classList.add('show');document.body.style.overflow='hidden';$('.modal-backdrop',root).onclick=closeModal;$$('.modal-close',root).forEach(b=>b.onclick=closeModal);}
function closeModal(){const root=$('#modalRoot');root.classList.remove('show');document.body.style.overflow='';setTimeout(()=>{if(!root.classList.contains('show'))root.innerHTML='';},200);}
function confirmModal(title,msg,onOk,okLabel='Delete'){openModal(`<div class="modal-head"><div class="confirm-ico"><i class="fa-solid fa-triangle-exclamation"></i></div><button class="icon-btn modal-close"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body"><h3 style="margin-bottom:6px">${esc(title)}</h3><p class="muted">${esc(msg)}</p></div><div class="modal-foot"><div class="spacer"></div><button class="btn btn-ghost modal-close">Cancel</button><button class="btn btn-danger" id="cfmOk">${esc(okLabel)}</button></div>`,440);$('#cfmOk').onclick=()=>{closeModal();onOk();};}
function addActivity(icon,text){db.activities.unshift({id:'a'+Date.now(),icon,text,time:new Date().toISOString()});db.activities=db.activities.slice(0,30);}
function pushNotif(icon,title,desc){db.notifications.unshift({id:'n'+Date.now(),icon,title,desc,time:new Date().toISOString(),read:false});db.notifications=db.notifications.slice(0,20);updateNotifDot();}
function updateNotifDot(){const n=db.notifications.filter(x=>!x.read).length;const d=$('#notifDot');d.style.display=n?'flex':'none';d.textContent=n>9?'9+':n;}
function paginate(list,c){const pages=Math.max(1,Math.ceil(list.length/c.per));if(c.page>pages)c.page=pages;const start=(c.page-1)*c.per;return {slice:list.slice(start,start+c.per),pages,total:list.length};}
function pageNumbers(cur,tot){if(tot<=7)return Array.from({length:tot},(_,i)=>i+1);const s=[...new Set([1,2,tot-1,tot,cur-1,cur,cur+1])].filter(n=>n>=1&&n<=tot).sort((a,b)=>a-b);const out=[];let prev=0;s.forEach(n=>{if(n-prev>1)out.push('…');out.push(n);prev=n;});return out;}
function pagerHtml(c,pages,total){if(pages<=1)return `<div class="pager"><span class="muted small">${total} record${total===1?'':'s'}</span><span></span></div>`;
  return `<div class="pager"><span class="muted small">Showing ${(c.page-1)*c.per+1}–${Math.min(c.page*c.per,total)} of ${total}</span><div class="pager-btns"><button class="icon-btn sm" data-pg="-1" ${c.page<=1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></button>${pageNumbers(c.page,pages).map(p=>p==='…'?'<span class="dots">…</span>':`<button class="page-n ${p===c.page?'on':''}" data-pgoto="${p}">${p}</button>`).join('')}<button class="icon-btn sm" data-pg="1" ${c.page>=pages?'disabled':''}><i class="fa-solid fa-chevron-right"></i></button></div></div>`;}
function bindPager(c){$$('#view [data-pg]').forEach(b=>b.onclick=()=>{c.page+=+b.dataset.pg;rerender();});$$('#view [data-pgoto]').forEach(b=>b.onclick=()=>{c.page=+b.dataset.pgoto;rerender();});}
function bindSearch(sel,c){const el=$(sel);if(!el)return;let t;el.addEventListener('input',()=>{c.q=el.value;clearTimeout(t);t=setTimeout(()=>{c._focus=true;c.page=1;rerender();},350);});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(t);c.q=el.value;c._focus=true;c.page=1;rerender();}});}
function restoreFocus(c,sel){if(c._focus){const el=$(sel);if(el){el.focus();const v=el.value;el.value='';el.value=v;}c._focus=false;}}
function animateKpis(){$$('#view .kpi-val[data-num]').forEach(el=>{const target=parseFloat(el.dataset.num),fmt=el.dataset.fmt,t0=performance.now(),dur=750;function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),v=target*e;el.textContent=fmt==='money'?money(v):Math.round(v).toLocaleString('en-US');if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);});}
function applyStock(o,dir){o.items.forEach(it=>{const p=db.products.find(x=>x.id===it.productId);if(p)p.stock=Math.max(0,p.stock+dir*it.qty);});}
function changeStatus(o,ns){if(o.status===ns)return;if(ns==='Cancelled'&&o.status!=='Cancelled')applyStock(o,1);if(ns!=='Cancelled'&&o.status==='Cancelled')applyStock(o,-1);o.status=ns;}

function grad(ctx,rgb){const {chart}=ctx;const {ctx:c,chartArea:a}=chart;if(!a)return `rgba(${rgb},.2)`;const g=c.createLinearGradient(0,a.top,0,a.bottom);g.addColorStop(0,`rgba(${rgb},.32)`);g.addColorStop(1,`rgba(${rgb},0)`);return g;}

    ${kpi('fa-cart-shopping','c2','Total Orders',active.length,'int',deltaHtml(pct(ord[11],ord[10])),spark(ord.slice(-8),'#0ea5e9'))}

  <div class="grid g-21 mb">

    <div class="card"><div class="card-h"><div><h3>Sales by Category</h3><p>Revenue distribution</p></div></div><div class="card-b"><div class="chart-box"><canvas id="chCat"></canvas></div></div></div>
  </div>
  <div class="grid g-21">
    <div class="card"><div class="card-h"><div><h3>Recent Orders</h3><p>Latest transactions across all channels</p></div><button class="btn btn-ghost btn-sm" data-goto="orders">View All <i class="fa-solid fa-arrow-right"></i></button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${recent}</tbody></table></div></div>
    <div class="stack">

/* ----- Orders ----- */
function viewOrders(){
  const c=ctl.orders;
  const counts={};['Pending','Processing','Shipped','Delivered','Cancelled'].forEach(s=>counts[s]=db.orders.filter(o=>o.status===s).length);
  const chips=['all',...Object.keys(counts)].map(s=>`<button class="chip ${c.status===s?'on':''}" data-ochip="${s}">${s==='all'?'All':s}<span>${s==='all'?db.orders.length:counts[s]}</span></button>`).join('');
  let list=[...db.orders];
  if(c.status!=='all')list=list.filter(o=>o.status===c.status);
  if(c.q){const q=c.q.toLowerCase();list=list.filter(o=>o.id.toLowerCase().includes(q)||o.customerName.toLowerCase().includes(q)||o.items.some(i=>i.name.toLowerCase().includes(q)));}
  list.sort((a,b)=>{let x=a[c.sortKey],y=b[c.sortKey];if(c.sortKey==='total'){x=+x;y=+y;}else{x=String(x).toLowerCase();y=String(y).toLowerCase();}return (x<y?-1:x>y?1:0)*c.sortDir;});
  const {slice,pages,total}=paginate(list,c);
  const ico=k=>c.sortKey===k?`<i class="fa-solid fa-caret-${c.sortDir===1?'up':'down'}"></i>`:'';
  const rows=slice.map(o=>`<tr><td class="mono strong">${o.id}</td><td>${avatar(o.customerName,26)} ${esc(o.customerName)}</td><td class="muted">${fmtDate(o.date)}</td><td class="muted">${o.items.reduce((s,i)=>s+i.qty,0)} items</td><td class="strong">${money2(o.total)}</td><td>${badge(o.status)}</td><td><div class="row-actions"><button class="icon-btn sm" data-oact="view" data-id="${o.id}" title="View"><i class="fa-regular fa-eye"></i></button><button class="icon-btn sm" data-oact="edit" data-id="${o.id}" title="Edit"><i class="fa-regular fa-pen-to-square"></i></button><button class="icon-btn sm danger" data-oact="del" data-id="${o.id}" title="Delete"><i class="fa-regular fa-trash-can"></i></button></div></td></tr>`).join('');
  return `<div class="toolbar"><div class="chips">${chips}</div><div class="toolbar-right"><button class="btn btn-ghost btn-sm" id="btnOrdersExport"><i class="fa-solid fa-download"></i> Export CSV</button><button class="btn btn-primary btn-sm" id="btnOrdersNew"><i class="fa-solid fa-plus"></i> New Order</button></div></div>
  <div class="card"><div class="toolbar inner"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="ordersSearch" placeholder="Search by ID, customer or product…" value="${esc(c.q)}"></div><div class="spacer"></div><span class="muted small">${total} order${total===1?'':'s'}</span></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th data-osort="id">Order ${ico('id')}</th><th data-osort="customerName">Customer ${ico('customerName')}</th><th data-osort="date">Date ${ico('date')}</th><th>Items</th><th data-osort="total">Total ${ico('total')}</th><th data-osort="status">Status ${ico('status')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>${slice.length?'':'<div class="empty"><i class="fa-regular fa-folder-open"></i>No orders match your filters</div>'}</div>${pagerHtml(c,pages,total)}</div>`;
}
function mountOrders(){
  const c=ctl.orders;
  bindSearch('#ordersSearch',c);restoreFocus(c,'#ordersSearch');bindPager(c);
  $$('#view [data-ochip]').forEach(b=>b.onclick=()=>{c.status=b.dataset.ochip;c.page=1;rerender();});
  $$('#view [data-osort]').forEach(th=>th.onclick=()=>{const k=th.dataset.osort;if(c.sortKey===k)c.sortDir*=-1;else{c.sortKey=k;c.sortDir=(k==='date'||k==='total')?-1:1;}c.page=1;rerender();});
  $$('#view [data-oact]').forEach(b=>b.onclick=()=>{const o=db.orders.find(x=>x.id===b.dataset.id);if(!o)return;const a=b.dataset.oact;
    if(a==='view')openOrderView(o.id);
    if(a==='edit')openOrderModal(o);
    if(a==='del')confirmModal('Delete order',`This will permanently delete ${o.id} and restore its stock. This action cannot be undone.`,()=>{if(o.status!=='Cancelled')applyStock(o,1);db.orders.splice(db.orders.indexOf(o),1);addActivity('fa-trash','Order '+o.id+' deleted');save();toast('Order deleted','fa-trash','warn');rerender();});});
  $('#btnOrdersNew').onclick=()=>openOrderModal(null);
  $('#btnOrdersExport').onclick=()=>{exportCSV('orders.csv',['Order ID','Customer','Date','Status','Subtotal','Tax','Shipping','Total'],db.orders.map(o=>[o.id,o.customerName,fmtDate(o.date),o.status,o.sub.toFixed(2),o.tax.toFixed(2),o.ship.toFixed(2),o.total.toFixed(2)]));toast('Orders exported to CSV');};
}

function viewProcurement(){

  if(procTab==='po'){
    const rows=db.pos.map(po=>{let acts='';
      if(po.status==='Pending')acts+=`<button class="btn btn-ghost btn-xs" data-poact="approve" data-id="${po.id}">Approve</button>`;
      if(po.status==='Approved')acts+=`<button class="btn btn-ghost btn-xs" data-poact="ship" data-id="${po.id}">Mark Shipped</button>`;
      if(po.status==='Approved'||po.status==='In Transit')acts+=`<button class="btn btn-primary btn-xs" data-poact="receive" data-id="${po.id}">Receive</button>`;
      if(po.status==='Received')acts+=`<span class="muted small"><i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Completed</span>`;
      acts+=`<button class="icon-btn sm danger" data-poact="del" data-id="${po.id}"><i class="fa-regular fa-trash-can"></i></button>`;
      return `<tr><td class="mono strong">${po.id}</td><td>${esc(po.supplierName)}</td><td>${esc(po.productName)}</td><td class="strong">${po.qty}</td><td class="strong">${money(po.qty*po.cost)}</td><td class="muted">${fmtDate(po.eta)}</td><td>${badge(po.status)}</td><td><div class="row-actions">${acts}</div></td></tr>`;}).join('');
    return tabs+`<div class="toolbar"><span class="muted small">${db.pos.length} purchase orders · ${db.pos.filter(p=>p.status!=='Received').length} open</span><div class="spacer"></div><button class="btn btn-primary btn-sm" id="btnPoNew"><i class="fa-solid fa-plus"></i> New Purchase Order</button></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>PO</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Cost</th><th>ETA</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  const rows=db.suppliers.map(s=>`<tr><td><div style="display:flex;align-items:center;gap:10px">${avatar(s.name,30)}<b style="font-size:13px">${esc(s.name)}</b></div></td><td>${esc(s.contact)}</td><td class="muted">${FLAGS[s.country]||'🌐'} ${esc(s.country)}</td><td class="muted">${esc(s.email)}</td><td>${stars(s.rating)}</td><td class="strong">${db.products.filter(p=>p.supplier===s.name).length}</td><td><div class="row-actions"><button class="icon-btn sm" data-sact="edit" data-id="${s.id}"><i class="fa-regular fa-pen-to-square"></i></button><button class="icon-btn sm danger" data-sact="del" data-id="${s.id}"><i class="fa-regular fa-trash-can"></i></button></div></td></tr>`).join('');
  return tabs+`<div class="toolbar"><span class="muted small">${db.suppliers.length} active suppliers</span><div class="spacer"></div><button class="btn btn-primary btn-sm" id="btnSupNew"><i class="fa-solid fa-plus"></i> Add Supplier</button></div>

function mountProcurement(){
  $$('#view [data-ptab]').forEach(b=>b.onclick=()=>{procTab=b.dataset.ptab;rerender();});
  $$('#view [data-poact]').forEach(b=>b.onclick=()=>{const po=db.pos.find(x=>x.id===b.dataset.id);const a=b.dataset.poact;
    if(a==='approve'){po.status='Approved';toast(po.id+' approved');}
    if(a==='ship'){po.status='In Transit';toast(po.id+' marked in transit','fa-truck','info');}

    if(a==='del'){confirmModal('Delete PO','Delete '+po.id+'? This does not affect stock.',()=>{db.pos.splice(db.pos.indexOf(po),1);save();toast('PO deleted','fa-trash','warn');rerender();});return;}
    save();rerender();});
  $$('#view [data-sact]').forEach(b=>b.onclick=()=>{const s=db.suppliers.find(x=>x.id===b.dataset.id);

}

    <div class="card kpi"><div class="kpi-top"><div class="kpi-ico c2"><i class="fa-solid fa-hourglass-half"></i></div></div><div class="kpi-val" data-num="${outstanding}" data-fmt="money">${money(outstanding)}</div><div class="kpi-label">Outstanding Receivables</div><div class="kpi-sub"><span class="vs">${db.invoices.filter(i=>i.status!=='Paid').length} open invoice(s)</span></div></div>
  </div>

    <div class="card"><div class="card-h"><div><h3>Revenue vs Expenses</h3><p>Trailing 12 months</p></div></div><div class="card-b"><div class="chart-box"><canvas id="chFin"></canvas></div></div></div>
    <div class="card"><div class="card-h"><div><h3>Expense Breakdown</h3><p>YTD allocation</p></div></div><div class="card-b"><div class="chart-box"><canvas id="chExp"></canvas></div></div></div>

  draft={items:editing?order.items.map(i=>({...i})):[{productId:'',qty:1}],editingId:editing?order.id:null};
  const custOpts=db.customers.map(c=>`<option value="${c.id}" ${editing&&order.customerId===c.id?'selected':''}>${esc(c.company)}</option>`).join('');
  const stOpts=['Pending','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${editing&&order.status===s?'selected':''}>${s}</option>`).join('');
  openModal(`<div class="modal-head"><div><h3>${editing?'Edit '+order.id:'New Sales Order'}</h3><p>${editing?'Modify items, status or customer':'Create a new order — stock is allocated automatically'}</p></div><button class="icon-btn modal-close"><i class="fa-solid fa-xmark"></i></button></div>
  <form id="orderForm" class="modal-body" style="overflow-y:auto">
    <div class="frow2"><label>Customer<select id="of-cust" required>${custOpts}</select></label><label>Order Date<input type="date" id="of-date" required value="${(editing?order.date:new Date().toISOString()).slice(0,10)}"></label></div>
    <label>Status<select id="of-status">${stOpts}</select></label>
    <div class="items-label"><span>Line Items</span><button type="button" class="btn btn-ghost btn-xs" id="of-additem"><i class="fa-solid fa-plus"></i> Add Item</button></div>
    <div id="of-items"></div>
    <div class="of-totals" id="of-totals"></div>
  </form>
  <div class="modal-foot"><div class="spacer"></div><button class="btn btn-ghost modal-close">Cancel</button><button class="btn btn-primary" id="of-save"><i class="fa-solid fa-check"></i> ${editing?'Save Changes':'Create Order'}</button></div>`,660);
  renderDraft();
  $('#orderForm').onsubmit=e=>{e.preventDefault();saveOrder();};
  $('#of-additem').onclick=()=>{draft.items.push({productId:'',qty:1});renderDraft();};
  $('#of-save').onclick=saveOrder;
}
function renderDraft(){
  const wrap=$('#of-items');
  wrap.innerHTML=draft.items.map((it,idx)=>{
    const opts='<option value="">Select product…</option>'+db.products.filter(p=>p.stock>0||it.productId===p.id).map(p=>`<option value="${p.id}" ${it.productId===p.id?'selected':''}>${esc(p.name)} — ${money2(p.price)}</option>`).join('');
    const p=db.products.find(x=>x.id===it.productId);
    return `<div class="draft-row"><select data-di="${idx}" data-f="productId">${opts}</select><input type="number" min="1" max="999" value="${it.qty}" data-di="${idx}" data-f="qty"><span class="draft-line">${p?money2(p.price*it.qty):'—'}</span><button type="button" class="icon-btn sm danger" data-del="${idx}"><i class="fa-regular fa-trash-can"></i></button></div>`;
  }).join('');
  const sub=draft.items.reduce((s,it)=>{const p=db.products.find(x=>x.id===it.productId);return s+(p?p.price*it.qty:0);},0);
  const tax=sub*.08,ship=sub>1000||sub===0?0:25;
  $('#of-totals').innerHTML=`<div>Subtotal<span>${money2(sub)}</span></div><div>Tax (8%)<span>${money2(tax)}</span></div><div>Shipping<span>${ship?money2(ship):'Free'}</span></div><div class="tt">Total<span>${money2(sub+tax+ship)}</span></div>`;
  $$('#of-items [data-di]').forEach(el=>el.onchange=()=>{const i=+el.dataset.di,f=el.dataset.f;draft.items[i][f]=f==='qty'?Math.max(1,Math.min(999,+el.value||1)):el.value;renderDraft();});
  $$('#of-items [data-del]').forEach(b=>b.onclick=()=>{draft.items.splice(+b.dataset.del,1);if(!draft.items.length)draft.items.push({productId:'',qty:1});renderDraft();});
}
function saveOrder(){
  const customerId=$('#of-cust').value,date=$('#of-date').value,status=$('#of-status').value;
  const items=draft.items.filter(it=>it.productId&&it.qty>0).map(it=>{const p=db.products.find(x=>x.id===it.productId);return {productId:p.id,name:p.name,qty:it.qty,price:p.price};});
  if(!items.length){toast('Add at least one line item','fa-triangle-exclamation','warn');return;}
  const sub=items.reduce((s,i)=>s+i.qty*i.price,0),tax=sub*.08,ship=sub>1000?0:25,total=sub+tax+ship;
  const cust=db.customers.find(c=>c.id===customerId);
  if(draft.editingId){
    const old=db.orders.find(o=>o.id===draft.editingId);
    if(old.status!=='Cancelled')applyStock(old,1);
    Object.assign(old,{customerId,customerName:cust.company,items,sub,tax,ship,total,status,date:new Date(date+'T12:00:00').toISOString()});
    if(status!=='Cancelled')applyStock(old,-1);
    toast('Order '+old.id+' updated');
  }else{
    const id='ORD-'+(db.seq.order++);
    const o={id,customerId,customerName:cust.company,items,sub,tax,ship,total,status,date:new Date(date+'T12:00:00').toISOString()};
    db.orders.unshift(o);
    if(status!=='Cancelled')applyStock(o,-1);
    addActivity('fa-cart-shopping',`New order ${id} from ${cust.company} — ${money(total)}`);
    pushNotif('fa-cart-shopping','New order received',`${id} · ${cust.company} · ${money(total)}`);
    toast('Order '+id+' created');
  }
  save();closeModal();navigate('orders');
}

/* ================= VIEWS REGISTRY ================= */
const VIEWS={
  dashboard:{title:'Dashboard',sub:'Business overview & key performance',render:viewDashboard,mount:mountDashboard},
  orders:{title:'Sales Orders',sub:'Create, track and manage customer orders',render:viewOrders,mount:mountOrders},
  inventory:{title:'Inventory',sub:'Stock levels, valuation and adjustments',render:viewInventory,mount:mountInventory},
  customers:{title:'Customers',sub:'CRM — accounts and lifetime value',render:viewCustomers,mount:mountCustomers},
  hr:{title:'Human Resources',sub:'Team, departments and payroll',render:viewHR,mount:mountHR},
  procurement:{title:'Procurement',sub:'Purchase orders and suppliers',render:viewProcurement,mount:mountProcurement},
  finance:{title:'Finance',sub:'Revenue, expenses and receivables',render:viewFinance,mount:mountFinance},
  reports:{title:'Reports',sub:'Analytics and data exports',render:viewReports,mount:mountReports},
  settings:{title:'Settings',sub:'Profile, preferences and data',render:viewSettings,mount:mountSettings}
};
function navigate(v){
  if(!VIEWS[v])return;
  currentView=v;
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  destroyCharts();
  $('#viewTitle').textContent=VIEWS[v].title;
  $('#viewSub').textContent=VIEWS[v].sub;
  $('#view').innerHTML=VIEWS[v].render();
  VIEWS[v].mount();
  document.body.classList.remove('m-open');
  window.scrollTo(0,0);
}

/* ================= THEME / USER ================= */
function applyTheme(t,persist=true){
  document.documentElement.dataset.theme=t;
  db.theme=t;
  const btn=$('#btnTheme');if(btn)btn.innerHTML=t==='dark'?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>';
  Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();
  if(persist)save();
  if(currentView&&VIEWS[currentView])navigate(currentView);
}

  $('#tbName').textContent=db.profile.name;$('#tbRole').textContent=db.profile.role;
  $('#tbAvatar').textContent=db.profile.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  $('#upName').textContent=db.profile.name;$('#upEmail').textContent=db.profile.email;
}

function renderNotifList(){
  const list=db.notifications.map(n=>`<div class="notif-item ${n.read?'':'unread'}" data-nid="${n.id}"><span class="n-ico" style="background:rgba(99,102,241,.12);color:var(--primary)"><i class="fa-solid ${n.icon}"></i></span><div style="flex:1"><b>${esc(n.title)}</b><p>${esc(n.desc)}</p><time>${timeAgo(n.time)}</time></div>${n.read?'':'<span class="dot" style="position:static;margin-top:4px"></span>'}</div>`).join('');
  $('#notifPop').innerHTML=`<div class="pop-head"><b>Notifications</b><button id="markAll">Mark all read</button></div><div class="notif-list">${list||'<div class="empty">No notifications</div>'}</div>`;
  $$('#notifPop [data-nid]').forEach(el=>el.onclick=()=>{const n=db.notifications.find(x=>x.id===el.dataset.nid);n.read=true;save();updateNotifDot();renderNotifList();});
  $('#markAll').onclick=()=>{db.notifications.forEach(n=>n.read=true);save();updateNotifDot();renderNotifList();};
}
function bindTopbar(){
  $('#btnSidebar').onclick=()=>{if(window.innerWidth<=1080)document.body.classList.toggle('m-open');else{document.body.classList.toggle('collapsed');db.ui.collapsed=document.body.classList.contains('collapsed');save();}};
  $('#sbOverlay').onclick=()=>document.body.classList.remove('m-open');
  $$('.nav-item').forEach(n=>n.onclick=()=>navigate(n.dataset.view));
  $('#btnTheme').onclick=()=>applyTheme(db.theme==='dark'?'light':'dark');
  $('#btnNewOrder').onclick=()=>openOrderModal(null);
  $('#btnNotif').onclick=e=>{e.stopPropagation();$('#userPop').classList.remove('show');$('#notifPop').classList.toggle('show');renderNotifList();};
  $('#btnUser').onclick=e=>{e.stopPropagation();$('#notifPop').classList.remove('show');$('#userPop').classList.toggle('show');};
  $('#upSettings').onclick=()=>{$('#userPop').classList.remove('show');navigate('settings');};
  $('#upBackup').onclick=()=>{$('#userPop').classList.remove('show');download('nexus-erp-backup.json','application/json',JSON.stringify(db,null,2));toast('Backup downloaded');};
  $('#btnSignout').onclick=()=>{$('#userPop').classList.remove('show');$('#login').classList.remove('hidden');$('#liEmail').value=db.profile.email;};
  $('#loginForm').onsubmit=e=>{e.preventDefault();$('#login').classList.add('hidden');toast('Welcome back, '+db.profile.name.split(' ')[0]+'!','fa-hand');};
  document.addEventListener('click',e=>{
    if(!e.target.closest('#notifPop')&&!e.target.closest('#btnNotif'))$('#notifPop').classList.remove('show');
    if(!e.target.closest('#userPop')&&!e.target.closest('#btnUser'))$('#userPop').classList.remove('show');
    if(!e.target.closest('.tb-search'))$('#searchPop').classList.remove('show');
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();$('#searchPop').classList.remove('show');$('#notifPop').classList.remove('show');$('#userPop').classList.remove('show');}
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus();}
  });
  /* Global quick search */
  const gs=$('#globalSearch'),pop=$('#searchPop');
  gs.addEventListener('input',()=>{
    const q=gs.value.trim().toLowerCase();
    if(q.length<2){pop.classList.remove('show');return;}
    const o=db.orders.filter(x=>x.id.toLowerCase().includes(q)||x.customerName.toLowerCase().includes(q)).slice(0,4);
    const p=db.products.filter(x=>x.name.toLowerCase().includes(q)||x.sku.toLowerCase().includes(q)).slice(0,4);
    const c=db.customers.filter(x=>x.company.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).slice(0,4);
    const e=db.employees.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3);
    if(!o.length&&!p.length&&!c.length&&!e.length){pop.innerHTML='<div class="sp-empty">No matches for “'+esc(gs.value)+'”</div>';pop.classList.add('show');return;}
    let html='';
    if(o.length)html+='<div class="sp-group">Orders</div>'+o.map(x=>`<button class="sp-item" data-go="orders" data-q="${esc(x.id)}"><i class="fa-solid fa-cart-shopping"></i><span>${esc(x.id)} · ${esc(x.customerName)}</span><em>${money(x.total)}</em></button>`).join('');
    if(p.length)html+='<div class="sp-group">Products</div>'+p.map(x=>`<button class="sp-item" data-go="inventory" data-q="${esc(x.name)}"><i class="fa-solid fa-box"></i><span>${esc(x.name)}</span><em>${x.stock} in stock</em></button>`).join('');
    if(c.length)html+='<div class="sp-group">Customers</div>'+c.map(x=>`<button class="sp-item" data-go="customers" data-q="${esc(x.company)}"><i class="fa-solid fa-users"></i><span>${esc(x.company)}</span><em>${esc(x.tier)}</em></button>`).join('');
    if(e.length)html+='<div class="sp-group">Employees</div>'+e.map(x=>`<button class="sp-item" data-go="hr" data-q="${esc(x.name)}"><i class="fa-solid fa-user-tie"></i><span>${esc(x.name)}</span><em>${esc(x.dept)}</em></button>`).join('');
    pop.innerHTML=html;pop.classList.add('show');
    $$('#searchPop [data-go]').forEach(b=>b.onclick=()=>{const v=b.dataset.go;ctl[v].q=b.dataset.q;ctl[v].page=1;if(v==='orders')ctl[v].status='all';gs.value='';pop.classList.remove('show');navigate(v);});
  });
}

/* ================= INIT ================= */
load();
if(db.ui&&db.ui.collapsed&&window.innerWidth>1080)document.body.classList.add('collapsed');
renderUserChip();
updateNotifDot();
bindTopbar();
applyTheme(db.theme||'light',false);
navigate('dashboard');
</script>
</body>
</html>
