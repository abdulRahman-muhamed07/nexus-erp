name: Split Frontend Assets

on:
  push:
    branches: [ "chore/split-frontend-assets" ]

jobs:
  split:
    if: ${{ !contains(github.event.head_commit.message, 'chore: frontend split artifact') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split monolithic frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path("nexus-erp.html")
          html = source.read_text(encoding="utf-8")

          style_match = re.search(r"<style\b[^>]*>(.*?)</style>", html, re.IGNORECASE | re.DOTALL)
          if not style_match:
              raise SystemExit("Inline <style> block was not found")

          css = style_match.group(1).strip() + "\n"
          html = html[:style_match.start()] + '<link rel="stylesheet" href="../css/nexus-erp.css">' + html[style_match.end():]

          inline_scripts = re.findall(r"<script\b(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script>", html, re.IGNORECASE | re.DOTALL)
          if not inline_scripts:
              raise SystemExit("No inline JavaScript blocks were found")

          js = "\n\n".join(block.strip() for block in inline_scripts if block.strip()).strip() + "\n"
          html = re.sub(r"<script\b(?![^>]*\bsrc\s*=)[^>]*>.*?</script>", "", html, flags=re.IGNORECASE | re.DOTALL)
          html = html.replace("</body>", '<script src="../js/nexus-erp.js"></script>\n</body>", 1)

          Path("front/html").mkdir(parents=True, exist_ok=True)
          Path("front/css").mkdir(parents=True, exist_ok=True)
          Path("front/js").mkdir(parents=True, exist_ok=True)
          Path("front/html/nexus-erp.html").write_text(html.strip() + "\n", encoding="utf-8")
          Path("front/css/nexus-erp.css").write_text(css, encoding="utf-8")
          Path("front/js/nexus-erp.js").write_text(js, encoding="utf-8")

      - name: Package frontend
        run: |
          rm -rf frontend-split
          mkdir -p frontend-split/front/html frontend-split/front/css frontend-split/front/js
          cp front/html/nexus-erp.html frontend-split/front/html/
          cp front/css/nexus-erp.css frontend-split/front/css/
          cp front/js/nexus-erp.js frontend-split/front/js/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-erp-frontend-split
          path: frontend-split/
