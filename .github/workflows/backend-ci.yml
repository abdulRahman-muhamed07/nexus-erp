name: Backend CI

on:
  push:
    branches: [ master, feature/frontend-split-final ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/backend-ci.yml'
      - 'nexus-erp.html'
      - 'front/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/backend-ci.yml'
      - 'nexus-erp.html'
      - 'front/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-split frontend at section boundaries
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/frontend-split-final' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feature/frontend-split-final';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: 'nexus-erp.html', ref: 'master' });
            const source = Buffer.from(file.content, 'base64').toString('utf8');
            const style = source.match(/<style\\b[^>]*>([\\s\\S]*?)<\\/style>/i);
            if (!style) core.setFailed('Inline CSS block not found');
            const css = style[1].trim() + '\\n';
            let html = source.slice(0, style.index) + '<link rel="stylesheet" href="../css/nexus-erp.css">' + source.slice(style.index + style[0].length);
            const scripts = [...html.matchAll(/<script\\b(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(m => m[1]);
            if (!scripts.length) core.setFailed('Inline JavaScript block not found');
            const js = scripts.join('\\n\\n').trim() + '\\n';
            const bodyless = html.replace(/<script\\b(?![^>]*\\bsrc\\s*=)[^>]*>[\\s\\S]*?<\\/script>/gi, '');
            const markers = [...js.matchAll(/^(\\/\\* =+ [^\\n]+ \\*\\/)/gm)].map(m => m.index);
            const starts = [0, ...markers.filter(i => i > 0)];
            const sections = [];
            for (let i = 0; i < starts.length; i++) {
              sections.push(js.slice(starts[i], starts[i + 1] ?? js.length));
            }
            const groups = Array.from({ length: 6 }, () => '');
            let group = 0;
            let size = 0;
            const target = js.length / 6;
            for (const section of sections) {
              if (group < 5 && size >= target && groups[group]) { group++; size = 0; }
              groups[group] += section;
              size += section.length;
            }
            html = bodyless.replace('</body>', Array.from({length:6}, (_,i) => `<script src="../js/nexus-erp-${String(i+1).padStart(2,'0')}.js"></script>`).join('\\n') + '\\n</body>', 1).trim() + '\\n';
            const makeBlob = async content => (await github.rest.git.createBlob({ owner, repo, content: Buffer.from(content, 'utf8').toString('base64'), encoding: 'base64' })).data.sha;
            const treeRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: treeRef.data.object.sha,
              tree: [
                {path:'front/html/nexus-erp.html',mode:'100644',type:'blob',sha:await makeBlob(html)},
                {path:'front/css/nexus-erp.css',mode:'100644',type:'blob',sha:await makeBlob(css)},
                {path:'front/js/nexus-erp-01.js',mode:'100644',type:'blob',sha:await makeBlob(groups[0])},
                {path:'front/js/nexus-erp-02.js',mode:'100644',type:'blob',sha:await makeBlob(groups[1])},
                {path:'front/js/nexus-erp-03.js',mode:'100644',type:'blob',sha:await makeBlob(groups[2])},
                {path:'front/js/nexus-erp-04.js',mode:'100644',type:'blob',sha:await makeBlob(groups[3])},
                {path:'front/js/nexus-erp-05.js',mode:'100644',type:'blob',sha:await makeBlob(groups[4])},
                {path:'front/js/nexus-erp-06.js',mode:'100644',type:'blob',sha:await makeBlob(groups[5])},
                {path:'nexus-erp.html',sha:null},
                {path:'front/html/.gitkeep',sha:null},
                {path:'front/css/.gitkeep',sha:null},
                {path:'front/js/.gitkeep',sha:null},
                {path:'.github/workflows/split-frontend.yml',sha:null},
                {path:'.github/workflows/split-frontend-once.yml',sha:null}
              ]
            });
            const commit = await github.rest.git.createCommit({ owner, repo, message:'chore: split frontend assets at section boundaries', tree:tree.data.sha, parents:[treeRef.data.object.sha] });
            await github.rest.git.updateRef({ owner, repo, ref:`heads/${branch}`, sha:commit.data.sha });

      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('*.sln') != '' }}
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        if: ${{ hashFiles('*.sln') != '' }}
        run: dotnet restore XeoTechErp.sln
      - name: Build
        if: ${{ hashFiles('*.sln') != '' }}
        run: dotnet build XeoTechErp.sln --configuration Release --no-restore
      - name: Test
        if: ${{ hashFiles('*.sln') != '' }}
        run: dotnet test XeoTechErp.sln --configuration Release --no-build --verbosity normal

      - name: Restore workflow file after split
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/frontend-split-final' }}
        run: |
          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/backend-ci.yml
          git add .github/workflows/backend-ci.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restore backend ci workflow"
          git push origin HEAD:feature/frontend-split-final
