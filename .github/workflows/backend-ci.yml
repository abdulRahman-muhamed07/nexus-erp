name: Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore XeoTechErp.sln
      - name: Build
        run: dotnet build XeoTechErp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test XeoTechErp.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
