name: Backend CI

on:
  push:
    branches: [ master, feature/frontend-split-final ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/backend-ci.yml'
      - 'nexus-erp.html'
      - 'front/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '.github/workflows/backend-ci.yml'
      - 'nexus-erp.html'
      - 'front/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split frontend at section boundaries
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/frontend-split-final' && !contains(github.event.head_commit.message, 'chore: split frontend assets') }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feature/frontend-split-final';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: 'nexus-erp.html', ref: 'master' });
            const source = Buffer.from(file.content, 'base64').toString('utf8');

            const styleOpen = source.indexOf('<style');
            if (styleOpen < 0) throw new Error('Inline CSS block not found');
            const styleStart = source.indexOf('>', styleOpen) + 1;
            const styleEnd = source.indexOf('</style>', styleStart);
            if (styleStart <= 0 || styleEnd < 0) throw new Error('Inline CSS block is malformed');
            const css = source.slice(styleStart, styleEnd).trim() + '\n';
            let html = source.slice(0, styleOpen) + '<link rel="stylesheet" href="../css/nexus-erp.css">' + source.slice(styleEnd + '</style>'.length);

            const inlineScripts = [];
            let searchFrom = 0;
            while (true) {
              const open = html.indexOf('<script', searchFrom);
              if (open < 0) break;
              const openEnd = html.indexOf('>', open);
              if (openEnd < 0) throw new Error('Malformed script tag');
              const openTag = html.slice(open, openEnd + 1).toLowerCase();
              const close = html.indexOf('</script>', openEnd + 1);
              if (close < 0) throw new Error('Malformed script block');
              if (!openTag.includes('src=')) inlineScripts.push(html.slice(openEnd + 1, close));
              searchFrom = close + '</script>'.length;
            }
            if (!inlineScripts.length) throw new Error('Inline JavaScript block not found');

            const js = inlineScripts.join('\n\n').trim() + '\n';
            let stripped = html;
            for (const block of inlineScripts) {
              const start = stripped.indexOf('<script', 0);
              const openEnd = stripped.indexOf('>', start);
              const close = stripped.indexOf('</script>', openEnd + 1);
              stripped = stripped.slice(0, start) + stripped.slice(close + '</script>'.length);
            }

            const sections = [];
            const marker = '/* =================';
            let first = js.indexOf(marker);
            if (first > 0) {
              sections.push(js.slice(0, first));
            } else if (first < 0) {
              sections.push(js);
              first = js.length;
            }
            let pos = first;
            while (pos < js.length && first < js.length) {
              const next = js.indexOf(marker, pos + marker.length);
              if (next < 0) { sections.push(js.slice(pos)); break; }
              sections.push(js.slice(pos, next));
              pos = next;
            }

            const groups = Array.from({ length: 6 }, () => '');
            let group = 0;
            let size = 0;
            const target = js.length / 6;
            for (const section of sections) {
              if (group < 5 && size >= target && groups[group]) { group++; size = 0; }
              groups[group] += section;
              size += section.length;
            }

            stripped = stripped.replace('</body>', Array.from({length:6}, (_,i) => `<script src="../js/nexus-erp-${String(i+1).padStart(2,'0')}.js"></script>`).join('\n') + '\n</body>');
            const finalHtml = stripped.trim() + '\n';

            const makeBlob = async content => (await github.rest.git.createBlob({ owner, repo, content: Buffer.from(content, 'utf8').toString('base64'), encoding: 'base64' })).data.sha;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: ref.data.object.sha,
              tree: [
                {path:'front/html/nexus-erp.html',mode:'100644',type:'blob',sha:await makeBlob(finalHtml)},
                {path:'front/css/nexus-erp.css',mode:'100644',type:'blob',sha:await makeBlob(css)},
                {path:'front/js/nexus-erp-01.js',mode:'100644',type:'blob',sha:await makeBlob(groups[0])},
                {path:'front/js/nexus-erp-02.js',mode:'100644',type:'blob',sha:await makeBlob(groups[1])},
                {path:'front/js/nexus-erp-03.js',mode:'100644',type:'blob',sha:await makeBlob(groups[2])},
                {path:'front/js/nexus-erp-04.js',mode:'100644',type:'blob',sha:await makeBlob(groups[3])},
                {path:'front/js/nexus-erp-05.js',mode:'100644',type:'blob',sha:await makeBlob(groups[4])},
                {path:'front/js/nexus-erp-06.js',mode:'100644',type:'blob',sha:await makeBlob(groups[5])},
                {path:'nexus-erp.html',sha:null},
                {path:'front/html/.gitkeep',sha:null},
                {path:'front/css/.gitkeep',sha:null},
                {path:'front/js/.gitkeep',sha:null}
              ]
            });
            const commit = await github.rest.git.createCommit({ owner, repo, message:'chore: split frontend assets', tree:tree.data.sha, parents:[ref.data.object.sha] });
            await github.rest.git.updateRef({ owner, repo, ref:`heads/${branch}`, sha:commit.data.sha });
            core.info(`Created ${commit.data.sha}`);

      - uses: actions/setup-dotnet@v4
      - name: Restore
        run: dotnet restore XeoTechErp.sln
      - name: Build
        run: dotnet build XeoTechErp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test XeoTechErp.sln --configuration Release --no-build --verbosity normal
